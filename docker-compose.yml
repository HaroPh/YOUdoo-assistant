# Hạ tầng SP-1B. KHÔNG có litellm (ADR-011 mục 2 — cả 3 nhà đã
# OpenAI-compatible nên LiteLLM hết lý do tồn tại).
#
# CÓ open-webui (thêm sau khi /v1 đã tồn tại — điều kiện "kế hoạch C" từng
# ghi ở đây nay đã có thật). Container + volume + port đều đặt tên riêng
# (youdoo-open-webui / youdoo_open_webui_data / 3002), KHÔNG dùng chung với
# bất kỳ instance open-webui nào khác có sẵn trên máy — tách biệt hoàn toàn,
# tránh đụng cấu hình của instance khác đang phục vụ việc riêng của nó.
#
# CÓ ollama (đổi 2026-08-06 — xem
# docs/superpowers/specs/2026-08-06-rag-ollama-isolation-design.md): trước
# đây dùng chung instance của D:\Project (localhost:11434) vì "không có dữ
# liệu cần cách ly". Live-test 2026-08-06 lộ ra lý do đó bỏ sót khía cạnh
# uptime — RAG sập khi D:\Project không chạy, và ở luồng mixed còn sập MỘT
# CÁCH IM LẶNG (fuse_answer nuốt lỗi, trả lời như thể chính sách không quy
# định thay vì báo lỗi hạ tầng). Container riêng, port host 11435 (11434 đã
# bị D:\Project chiếm), volume riêng youdoo_ollama_data, KHÔNG cấp GPU (máy
# dev dùng GPU cho Ollama của D:\Project chạy qwen3:8b — không khai báo GPU
# passthrough ở đây để tự chạy CPU-only, tránh tranh chấp VRAM). Chỉ cần
# pull bge-m3 (~1.1GB, nhỏ hơn nhiều qwen3:8b) — xem docs/getting-started.md.
#
# Postgres THÌ CÓ instance riêng, không dùng chung với D:\Project: D:\Project
# đã có container postgres của riêng nó trên cổng host 5433, đang chạy với dữ
# liệu thật của project đó (rag_chunks, rag_documents, erp_action_audit,
# checkpoints, ...). Dùng chung sẽ rủi ro lẫn dữ liệu giữa hai project, nên
# Youdoo dựng container Postgres MỚI, hoàn toàn cách ly (image, volume, cổng
# host riêng — 5434, không phải 5433).
#
# Odoo nằm NGOÀI compose này — trỏ qua ODOO_URL. Repo nguồn dùng
# host.docker.internal:8069.

volumes:
  youdoo_postgres_data:
    driver: local
  youdoo_ollama_data:
    driver: local
  youdoo_open_webui_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: youdoo-postgres
    # Host 5434 — D:\Project đã chiếm 5433 với container postgres riêng của
    # nó (dữ liệu thật, không được đụng vào). Container/network vẫn dùng 5432.
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thay_bang_mat_khau}
      POSTGRES_DB: ai_assistant
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - youdoo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: youdoo-ollama
    # 11435 — không phải 11434 mặc định: D:\Project đã chạy instance riêng
    # của nó ở đó. KHÔNG khai báo GPU passthrough (không có block
    # deploy.resources.reservations.devices) — instance này chỉ cần embed
    # bge-m3 (~1.1GB), để CPU-only tránh tranh chấp VRAM với Ollama của
    # D:\Project (đang giữ GPU cho qwen3:8b).
    ports: ["11435:11434"]
    volumes:
      - youdoo_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: youdoo-open-webui
    restart: unless-stopped
    # 3002 — không phải 3000/3001: một instance open-webui KHÁC (không thuộc
    # project này) có thể đã chiếm 3000 trên máy dev; Langfuse đã chiếm 3001.
    ports: ["3002:8080"]
    environment:
      # Backend FastAPI (backend/run.py) chạy TRÊN HOST, không nằm trong
      # compose này — trỏ qua host.docker.internal, cùng cách ODOO_URL đã
      # dùng (xem comment đầu file).
      OPENAI_API_BASE_URL: http://host.docker.internal:${BACKEND_PORT:-8002}/v1
      # Backend /v1 không yêu cầu Authorization header — giá trị dưới đây chỉ
      # để điền field bắt buộc của Open WebUI, không phải secret thật.
      OPENAI_API_KEY: youdoo-local-dev
      WEBUI_NAME: "Youdoo ERP Assistant"
      # Open WebUI tự bật tích hợp Ollama nếu detect được instance khả dụng
      # qua mạng — extra_hosts bên dưới (cần để gọi backend Youdoo) vô tình
      # cũng cho container thấy Ollama DÙNG CHUNG của D:\Project
      # (localhost:11434, có model local KHÔNG liên quan project này). Tắt
      # hẳn để danh sách model chỉ còn đúng "erp-assistant".
      ENABLE_OLLAMA_API: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - youdoo_open_webui_data:/app/backend/data

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    restart: unless-stopped
    profiles: ["observability"]
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - 127.0.0.1:3030:3030
    environment: &langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-thay_bang_mat_khau}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-thay_bang_salt_that}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-thay_bang_64_ky_tu_hex}
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-thay_bang_mat_khau_clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-thay_bang_mat_khau_minio}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-thay_bang_mat_khau_minio}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-thay_bang_mat_khau_redis}

  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    restart: unless-stopped
    profiles: ["observability"]
    depends_on: *langfuse-depends-on
    ports:
      # 3001, KHÔNG phải 3000 mặc định của Langfuse — khớp LANGFUSE_HOST đã
      # có sẵn trong .env.example từ trước (SP-1 foundation).
      - 3001:3000
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-thay_bang_secret_that}
      # Headless init (self-hosting/administration/headless-initialization) —
      # tự tạo org/project/user/API-key lúc boot đầu tiên, không cần qua UI
      # (agent không có trình duyệt). Chỉ tác dụng khi DB `langfuse` còn
      # trống; đổi giá trị sau khi đã init lần đầu không có tác dụng gì.
      LANGFUSE_INIT_ORG_ID: youdoo
      LANGFUSE_INIT_ORG_NAME: Youdoo
      LANGFUSE_INIT_PROJECT_ID: youdoo-erp
      LANGFUSE_INIT_PROJECT_NAME: Youdoo ERP Assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@youdoo.local}
      LANGFUSE_INIT_USER_NAME: Youdoo Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-thay_bang_mat_khau_langfuse}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    profiles: ["observability"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-thay_bang_mat_khau_clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    profiles: ["observability"]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-thay_bang_mat_khau_minio}
    ports:
      - 9090:9000
      - 127.0.0.1:9091:9001
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    profiles: ["observability"]
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:-thay_bang_mat_khau_redis}
      --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
