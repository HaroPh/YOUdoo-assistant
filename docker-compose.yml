# Hạ tầng SP-1B. KHÔNG có litellm (ADR-011 mục 2 — cả 3 nhà đã
# OpenAI-compatible nên LiteLLM hết lý do tồn tại) và KHÔNG có open-webui
# (giao diện chat chỉ có nghĩa khi có /v1, tức kế hoạch C).
#
# KHÔNG có ollama: D:\Project đã chạy sẵn một instance ollama dùng chung
# (localhost:11434, đã pull sẵn bge-m3). Ollama chỉ là model server, không có
# dữ liệu cần cách ly theo project — dựng thêm một container thứ hai ở đây chỉ
# tốn thêm ~1.2GB+ disk/VRAM mà không mang lại lợi ích gì, nên dùng chung thay
# vì trùng lặp. .env.example: OLLAMA_URL đã trỏ thẳng vào instance dùng chung
# đó (khác với litellm/open-webui — hai cái đó bị bỏ vì hoãn sang kế hoạch
# khác, không phải vì dùng chung).
#
# Postgres THÌ CÓ instance riêng, không dùng chung với D:\Project: D:\Project
# đã có container postgres của riêng nó trên cổng host 5433, đang chạy với dữ
# liệu thật của project đó (rag_chunks, rag_documents, erp_action_audit,
# checkpoints, ...). Dùng chung sẽ rủi ro lẫn dữ liệu giữa hai project, nên
# Youdoo dựng container Postgres MỚI, hoàn toàn cách ly (image, volume, cổng
# host riêng — 5434, không phải 5433).
#
# Odoo nằm NGOÀI compose này — trỏ qua ODOO_URL. Repo nguồn dùng
# host.docker.internal:8069.

volumes:
  youdoo_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: youdoo-postgres
    # Host 5434 — D:\Project đã chiếm 5433 với container postgres riêng của
    # nó (dữ liệu thật, không được đụng vào). Container/network vẫn dùng 5432.
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thay_bang_mat_khau}
      POSTGRES_DB: ai_assistant
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - youdoo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    restart: unless-stopped
    profiles: ["observability"]
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - 127.0.0.1:3030:3030
    environment: &langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-thay_bang_mat_khau}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-thay_bang_salt_that}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-thay_bang_64_ky_tu_hex}
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-thay_bang_mat_khau_clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-thay_bang_mat_khau_minio}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-thay_bang_mat_khau_minio}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-thay_bang_mat_khau_redis}

  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    restart: unless-stopped
    profiles: ["observability"]
    depends_on: *langfuse-depends-on
    ports:
      # 3001, KHÔNG phải 3000 mặc định của Langfuse — khớp LANGFUSE_HOST đã
      # có sẵn trong .env.example từ trước (SP-1 foundation).
      - 3001:3000
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-thay_bang_secret_that}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    profiles: ["observability"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-thay_bang_mat_khau_clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    profiles: ["observability"]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-thay_bang_mat_khau_minio}
    ports:
      - 9090:9000
      - 127.0.0.1:9091:9001
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    profiles: ["observability"]
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:-thay_bang_mat_khau_redis}
      --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
